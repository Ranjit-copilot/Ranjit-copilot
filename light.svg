<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Ranjit Rajbhar, Sr. Support Engineer, IT Support, System Administration, Networking and IT Operations profile">
  <title>Ranjit Rajbhar — Technical Profile</title>
  <desc>Terminal-inspired professional profile for Ranjit Rajbhar, Sr. Support Engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF6FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;.03 .01;0 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
