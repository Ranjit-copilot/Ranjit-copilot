    </radialGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
